name: Windows companion
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install document dependencies
        run: python -m pip install -r requirements-document-tools.txt
      - name: Exercise shared worker on Windows
        run: python -m unittest discover -s agents/tests -p test_windows_worker.py
      - name: Check native permissions and menu sizing
        run: dotnet run --project test/windows_core/WindowsCore.csproj
      - name: Check application grants
        run: dotnet run --project test/windows_apps/AppChecks.csproj
      - name: Check file operations
        run: dotnet run --project test/windows_files/FileChecks.csproj
      - name: Check pairing
        run: dotnet run --project test/windows_pairing/PairingChecks.csproj
      - name: Build self-contained installer
        run: python scripts/build_windows_installer.py
